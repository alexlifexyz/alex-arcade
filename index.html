<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<title>Alex Arcade · 街机大厅</title>
<meta name="description" content="Alex Arcade：三键掌机原生游戏 + 复古 FC/GBA/CPS1 模拟器合集，浏览器里即开即玩。">
<style>
  :root {
    --bg: #0b0910; --bg2: #131019; --card: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.1); --text: #f3ece0; --sub: #a79f93;
    --gold: #f0c14b; --pink: #ff4d8d; --cyan: #38e1ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  a { color: inherit; text-decoration: none; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  body { display: grid; place-items: center; padding: 20px; }
  .gate { width: min(520px, 100%); }
  .brand { text-align: center; margin-bottom: 32px; }
  .brand .coin { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px; background: radial-gradient(circle at 35% 28%, #ffe08a, #f0c14b 55%, #8a5a10); box-shadow: 0 0 0 3px #1a1008, 0 0 0 4px var(--gold), 0 0 30px rgba(240,193,75,.3); display: grid; place-items: center; font-size: 28px; }
  .brand h1 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 42px; letter-spacing: .12em; color: var(--gold); }
  .brand p { color: var(--sub); font-size: 14px; margin-top: 6px; }
  .cards { display: grid; gap: 16px; }
  .card { display: flex; align-items: center; gap: 18px; padding: 22px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); transition: transform .15s, border-color .15s, box-shadow .2s; }
  .card:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 20px 40px rgba(0,0,0,.4), 0 0 30px color-mix(in srgb, var(--c) 18%, transparent); }
  .card .icon { width: 64px; height: 64px; border-radius: 16px; background: var(--bg2); display: grid; place-items: center; font-size: 30px; flex-shrink: 0; }
  .card h2 { font-size: 20px; margin-bottom: 5px; }
  .card p { font-size: 13px; color: var(--sub); line-height: 1.6; }
  .card .tag { margin-left: auto; font-size: 11px; font-weight: 900; padding: 5px 10px; border-radius: 99px; background: var(--c); color: #120c06; white-space: nowrap; }
  footer { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; color: var(--sub); font-size: 12px; }
  @media (max-width: 480px) { .card { flex-direction: column; text-align: center; } .card .tag { margin-left: 0; } }
</style>
</head>
<body>
  <main class="gate">
    <div class="brand">
      <div class="coin">🪙</div>
      <h1>ALEX ARCADE</h1>
      <p>选择一个大厅开始</p>
    </div>
    <div class="cards">
      <a class="card" href="arcade/" style="--c: var(--gold)">
        <div class="icon">🎮</div>
        <div>
          <h2>三键街机厅</h2>
          <p>为 FoloToy AI Passport 掌机打造的原生游戏。UP、DOWN、OK 三颗键，即点即玩。</p>
        </div>
        <span class="tag">原生游戏</span>
      </a>
      <a class="card" href="retro-arcade/" style="--c: var(--cyan)">
        <div class="icon">🕹️</div>
        <div>
          <h2>复古模拟器厅</h2>
          <p>104 款经典 FC / NES、GBA、CPS1 街机。支持键盘、虚拟按键与蓝牙手柄。</p>
        </div>
        <span class="tag">104 款</span>
      </a>
    </div>
  </main>
  <footer>© 2026 Alex Arcade · 游戏版权归原所有者</footer>
</body>
</html>
