<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>网球王子天才少年</title>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // 真机全局异常捕获监控，防止任何静默黑屏
    window.addEventListener('error', function(e) {
      console.error('[UNCAUGHT ERROR]', e);
      var msg = (e && e.message) ? e.message : String(e);
      var box = document.getElementById('debug-err');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-err';
        box.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:rgba(200,0,0,0.9);color:#fff;padding:12px;border-radius:8px;font-size:12px;z-index:99999;word-break:break-all;';
        document.body.appendChild(box);
      }
      box.textContent = '运行异常: ' + msg;
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[UNHANDLED REJECTION]', e);
    });
  </script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- 攻略笔记弹窗 -->
  <div id="guide-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">通关攻略笔记</div>
        <button id="guide-close" class="modal-close-btn" type="button">×</button>
      </div>
      <div class="modal-body">
        <div class="guide-section author-card">
          <div class="author-info">
            <div class="author-name">Alex 游戏百宝箱</div>
            <div class="author-desc">先按原版玩。想换一种走法，关注后再打开。</div>
          </div>
          <button id="btn-guide-on" class="btn-follow" type="button">关注后，换成笔记走法</button>
          <button id="btn-guide-off" class="btn-follow" type="button" style="margin-top:8px;background:#2a2a30;">按原版来</button>
        </div>
        <div class="guide-section">
          <div class="section-title">笔记里的核心机制</div>
          <div class="guide-item">
            <span class="guide-tag gold">网球王子天才少年 特性</span>
            <span class="guide-desc">原版剧情与冒险系统，随时按 A 键确认互动，按 B 键返回或使用副技能。</span>
          </div>
          <div class="guide-item">
            <span class="guide-tag purple">神圣锻造</span>
            <span class="guide-desc">将收集到的稀有奥利哈钢与秘银矿石交给锻造大师，打造全词条金色极品神装。</span>
          </div>
          <div class="guide-item">
            <span class="guide-tag blue">八大职业加点图鉴</span>
            <span class="guide-desc">战士、龙战士、狂战士主攻防爆发；暗黑巫师、祭司精研法术；弓手、忍者、格斗家主敏捷暴击。</span>
          </div>
        </div>
        <div class="guide-section">
          <div class="section-title">原版地牢探索技巧</div>
          <div class="guide-item">
            <span class="guide-tag green">地牢探索</span>
            <span class="guide-desc">活用小地图探索隐藏暗室，宝箱怪与强力精英守卫掉落珍稀战利品。</span>
          </div>
          <div class="guide-item">
            <span class="guide-tag red">蓄力绝技</span>
            <span class="guide-desc">长按主武器 A 键积蓄能量槽至满格，松开施展各职业大范围专属强力蓄力技。</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部服务检修控制面板 (双层控制面板) -->
  <div id="deck-controls">
    <!-- 第二层：游戏控制辅助层 (左侧复位，中间攻略，右侧声音，工整对称) -->
    <div id="toolbar-sub">
      <button id="btn-reset" type="button">复位</button>
      <button id="btn-guide" type="button">攻略</button>
      <button id="btn-sound" type="button">声音</button>
    </div>
    <!-- 第一层：系统工具底栏 (标准4键) -->
    <div id="toolbar">
      <button id="btn-save" type="button">存档</button>
      <button id="btn-fast" type="button">3× 加速</button>
      <button id="btn-settings" type="button">设置</button>
      <button id="btn-record" type="button">59s 录屏</button>
    </div>
  </div>

  <!-- 掌机主渲染画布 -->
  <canvas id="main-canvas"></canvas>

  <!-- GBA 核心离屏输出画布 (240x160) -->
  <div id="core-host" style="display:none;">
    <canvas id="screen" width="240" height="160"></canvas>
  </div>

  <!-- 引入依赖脚本 (严格按序外置加载，严禁 type=module) -->
  <script src="assets/config.js"></script>
  <script src="assets/xhs-bridge.js"></script>
  <script src="assets/lzstring.js"></script>
  <script src="assets/gba.min.js"></script>
  <script src="assets/rom.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/skin.js"></script>
  <script src="assets/shell.js"></script>
</body>
</html>
