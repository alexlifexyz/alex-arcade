<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>魔界村</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- 双层服务检修控制底栏 -->
  <div id="deck-controls">
    <!-- 第二层：辅助控制层 (左侧复位，右侧声音，左右工整对称) -->
    <div id="toolbar-sub">
      <button id="btn-reset" type="button">复位</button>
      <button id="btn-sound" type="button">声音</button>
    </div>
    <!-- 第一层：系统控制工具栏 (标准4键) -->
    <div id="toolbar">
      <button id="btn-save" type="button">存档</button>
      <button id="btn-fast" type="button">3× 加速</button>
      <button id="btn-settings" type="button">设置</button>
      <button id="btn-record" type="button">59s 录屏</button>
    </div>
  </div>

  <canvas id="main-canvas"></canvas>

  <script src="./assets/config.js"></script>
  <script src="./assets/xhs-bridge.js"></script>
  <script src="./assets/lzstring.js"></script>
  <script src="./assets/nes.min.js"></script>
  <script src="./assets/rom.js"></script>
  <script src="./assets/core.js"></script>
  <script src="./assets/skin.js"></script>
  <script src="./assets/shell.js"></script>
</body>
</html>
