<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>超级马力欧大陆 1989</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script>
    // 真机全局异常捕获监控，防止任何静默黑屏
    window.addEventListener('error', function(e) {
      console.error('[UNCAUGHT ERROR]', e);
      var msg = (e && e.message) ? e.message : String(e);
      var box = document.getElementById('debug-err');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-err';
        box.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:rgba(200,0,0,0.9);color:#fff;padding:12px;border-radius:8px;font-size:12px;z-index:99999;word-break:break-all;';
        document.body.appendChild(box);
      }
      box.textContent = '运行异常: ' + msg;
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[UNHANDLED REJECTION]', e);
    });
  </script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- 底部服务检修控制面板 -->
  <div id="toolbar">
    <button id="btn-save" type="button">存档</button>
    <button id="btn-fast" type="button">3× 加速</button>
    <button id="btn-settings" type="button">设置</button>
    <button id="btn-record" type="button">59s 录屏</button>
  </div>

  <canvas id="main-canvas"></canvas>

  <script src="./assets/config.js"></script>
  <script src="./assets/xhs-bridge.js"></script>
  <script src="./assets/lzstring.js"></script>
  <script src="./assets/gb.min.js"></script>
  <script src="./assets/rom.js"></script>
  <script src="./assets/core.js"></script>
  <script src="./assets/skin.js"></script>
  <script src="./assets/shell.js"></script>
</body>
</html>
