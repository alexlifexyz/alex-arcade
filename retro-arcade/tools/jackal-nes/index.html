<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>赤色要塞</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script>
    window.addEventListener('error', function(e) {
      console.error('[UNCAUGHT ERROR]', e);
      var msg = (e && e.message) ? e.message : String(e);
      var box = document.getElementById('debug-err');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-err';
        box.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:rgba(200,0,0,0.9);color:#fff;padding:12px;border-radius:8px;font-size:12px;z-index:99999;word-break:break-all;';
        document.body.appendChild(box);
      }
      box.textContent = '运行异常: ' + msg;
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[UNHANDLED REJECTION]', e);
    });
  </script>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div id="guide-modal" class="guide-modal" hidden>
    <div class="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <div class="guide-head">
        <div id="guide-title" class="guide-title">赤色要塞攻略</div>
        <button id="guide-close" type="button">关闭</button>
      </div>
      <div class="guide-body">
        <p>十字键开车。B 打机枪，A 用副武器。</p>
        <p>冲上沙滩，把人质接到车上，再送回直升机。</p>
        <p>底下可以存档，也可以开 3× 加速。</p>
        <button id="btn-lives" type="button">九十九条命</button>
        <p class="guide-note">默认按原版命数。点上面这一项，这一局保持九十九条命；再点一次就关。</p>
      </div>
    </div>
  </div>

  <div id="deck-controls">
    <div id="toolbar-sub">
      <button id="btn-reset" type="button">复位</button>
      <button id="btn-guide" type="button">攻略</button>
      <button id="btn-sound" type="button">声音</button>
    </div>
    <div id="toolbar">
      <button id="btn-save" type="button">存档</button>
      <button id="btn-fast" type="button">3× 加速</button>
      <button id="btn-settings" type="button">设置</button>
      <button id="btn-record" type="button">59s 录屏</button>
    </div>
  </div>

  <canvas id="main-canvas"></canvas>

  <script src="./assets/config.js"></script>
  <script src="./assets/xhs-bridge.js"></script>
  <script src="./assets/nes.min.js"></script>
  <script src="./assets/rom.js"></script>
  <script src="./assets/core.js"></script>
  <script src="./assets/skin.js"></script>
  <script src="./assets/shell.js"></script>
</body>
</html>
