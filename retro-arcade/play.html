<!DOCTYPE html>
<html lang="zh-CN" data-mode="full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alex 游戏百宝箱 · 网页播放器</title>
  <style>
    :root {
      --bg: #0b0d13;
      --panel: #131722;
      --border: #2b344d;
      --text: #f0f4f8;
      --sub: #94a3b8;
      --accent: #00d2ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .topbar {
      width: 100%;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 5;
    }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .brand small { display: block; font-size: 11px; font-weight: 400; color: var(--sub); margin-top: 3px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; }
    .game-select {
      background: #1c2233;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      max-width: 230px;
      margin-right: 10px;
    }
    .mode-switch, .mini-switch { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .mode-btn, .mini-btn {
      background: #1c2233;
      color: var(--sub);
      border: 0;
      border-right: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mode-btn:last-child, .mini-btn:last-child { border-right: 0; }
    .mode-btn.active, .mini-btn.active { background: var(--accent); color: #0b0d13; font-weight: 700; }
    #btn-browser-fullscreen { margin-left: 10px; }

    .stage {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }
    /* 掌机模式：iframe 原样显示整台掌机 */
    .frame-box {
      width: 390px;
      height: 780px;
      max-width: 100%;
      max-height: 100%;
      background: #05060a;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
    }
    #game-frame { width: 100%; height: 100%; border: 0; display: block; }

    /* 纯画面 / 虚拟键模式：iframe 保持标准掌机尺寸置于底层，避免 2px 视口导致布局坍缩与 rAF 节流，
       同时 full-stage (z-index: 2, background: #000) 覆盖其上 */
    body[data-mode="full"] .frame-box,
    body[data-mode="virtual"] .frame-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 390px;
      height: 780px;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      opacity: .01;
      pointer-events: none;
      z-index: 1;
    }
    .full-stage { display: none; position: absolute; inset: 0; background: #000; z-index: 2; }
    body[data-mode="full"] .full-stage,
    body[data-mode="virtual"] .full-stage { display: block; }

    /* 与游戏画面等尺寸的容器：功能键、虚拟键都贴着画面摆，不再飘到舞台角落 */
    #screen-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      /* 上移 22px，给底部细条工具留一条黑边，不遮挡游戏画面 */
      transform: translate(-50%, calc(-50% - 22px));
    }
    #full-canvas {
      position: relative;
      display: block;
      /* 只保留 pixelated：crisp-edges 写在后面会覆盖它，将来若改用 CSS 放大就会变糊 */
      image-rendering: pixelated;
      background: #000;
    }
    /* 宽屏时贴在画面右侧黑边（完全不遮 HUD）；黑边不够就退回画面内右上角 */
    .full-actions { position: absolute; right: 8px; top: 8px; display: flex; }
    .full-actions.outside { left: calc(100% + 8px); right: auto; top: 0; flex-direction: column; }
    .full-actions.outside .capsule-btn { margin-left: 0; margin-bottom: 8px; }
    .capsule-btn {
      background: rgba(12, 15, 22, .5);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      margin-left: 8px;
      cursor: pointer;
      touch-action: none;
    }
    .capsule-btn:active { background: rgba(0, 210, 255, .55); }

    /* 虚拟键层（覆盖画面区域，而不是整个舞台） */
    .virtual-layer { display: none; position: absolute; inset: 0; pointer-events: none; }
    body[data-mode="virtual"] .virtual-layer { display: block; }
    .vkey {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(240, 246, 255, .18);
      border: 1px solid rgba(255, 255, 255, .45);
      color: #fff;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .vkey small { font-size: 10px; opacity: .75; }
    .vkey.down { background: rgba(0, 210, 255, .55); }
    .vkey[data-kind="capsule"] { width: 64px; height: 32px; border-radius: 999px; font-size: 11px; }
    .vkey[data-kind="direction"] { background: rgba(240, 246, 255, .12); }

    /* 纯画面模式下的细条工具 */
    .overlay-tools {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      background: rgba(12, 15, 22, .78);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      padding: 5px 8px;
      white-space: nowrap;
    }
    .overlay-tools button {
      background: transparent;
      color: #e6edf6;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, .16);
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .overlay-tools button:last-child { border-right: 0; }
    .overlay-tools button.active { color: var(--accent); font-weight: 700; }

    .notice { font-size: 12px; color: var(--sub); padding: 0 16px 6px; text-align: center; flex-shrink: 0; }
    /* 调试信息默认收起，只留一行手柄状态 */
    .footer {
      width: 100%;
      border-top: 1px solid var(--border);
      padding: 6px 16px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.6;
      flex-shrink: 0;
      max-height: 40vh;
      overflow: auto;
    }
    .status-line { display: flex; align-items: center; flex-wrap: wrap; }
    .status-line > span { margin-right: 12px; }
    #debug-panel { margin-left: auto; }
    #debug-panel summary { cursor: pointer; color: var(--sub); font-size: 11px; }
    #debug-panel[open] { width: 100%; margin-top: 6px; }
    #debug-panel[open] summary { margin-bottom: 4px; }
    #bridge-status { font-weight: 700; }
    #bridge-status.ready { color: #4ade80; }
    #bridge-status.error { color: #f87171; }
    #diag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; white-space: pre-wrap; }
    @media (max-width: 620px) {
      .topbar { padding: 8px 10px; }
      .game-select { max-width: 100%; margin: 6px 0 0; }
      .mode-switch, #btn-browser-fullscreen { margin-top: 6px; }
      .frame-box { width: 100%; height: 100%; border-radius: 0; }
      .overlay-tools { max-width: 100%; overflow-x: auto; }
      .vkey { width: 52px; height: 52px; }
    }

    /* 联机模式与弹窗样式 */
    .netplay-btn {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: #fff !important;
      font-weight: 700;
      border: 0 !important;
      margin-left: 8px;
    }
    .netplay-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .78);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .netplay-modal.show { display: flex; }
    .netplay-card {
      background: #141824;
      border: 1px solid #3b82f6;
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .8);
    }
    .netplay-card h3 { font-size: 18px; margin-bottom: 6px; color: #fff; }
    .netplay-card p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; line-height: 1.5; }
    .qr-container {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      min-width: 160px;
      min-height: 160px;
    }
    .room-badge {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .netplay-ip-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #94a3b8;
    }
    .netplay-ip-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      width: 160px;
      text-align: center;
    }
    .netplay-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }
    .netplay-action-btn {
      background: #3b82f6;
      color: #fff;
      border: 0;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .netplay-action-btn.secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .netplay-status-text {
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      color: #facc15;
    }

    /* 手机访客 (Client) 专属全屏界面 */
    body.is-client .topbar,
    body.is-client .notice,
    body.is-client .footer,
    body.is-client #frame-box,
    body.is-client #full-stage {
      display: none !important;
    }
    #client-stage {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body.is-client #client-stage { display: flex; flex-direction: column; }
    #client-video {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      background: #000;
    }
    .client-header {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .client-pill {
      background: rgba(15, 23, 42, .85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 600;
      pointer-events: auto;
    }
    .client-pill .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }
    /* 手机端虚拟摇杆与按键层 */
    .client-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .touch-interactive { pointer-events: auto; }
    .client-shoulders {
      position: absolute;
      top: 52px;
      left: 16px;
      right: 16px;
      display: none;
      justify-content: space-between;
      pointer-events: none;
    }
    .shoulder-btn {
      pointer-events: auto;
      min-width: 68px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .28);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      touch-action: none;
    }
    .shoulder-btn:active, .shoulder-btn.active {
      background: rgba(0, 210, 255, .55);
      transform: scale(.95);
    }
    .client-dpad {
      position: absolute;
      left: 18px;
      bottom: 24px;
      width: 152px;
      height: 152px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .12);
      touch-action: none;
    }
    .dpad-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      pointer-events: none;
      transition: background .06s, transform .06s;
    }
    .dpad-btn.active {
      background: rgba(0, 210, 255, .58);
      border-color: rgba(0, 210, 255, .95);
      transform: scale(.94);
    }
    .dpad-up { left: 52px; top: 4px; }
    .dpad-down { left: 52px; bottom: 4px; }
    .dpad-left { left: 4px; top: 52px; }
    .dpad-right { right: 4px; top: 52px; }

    .client-actions {
      position: absolute;
      right: 18px;
      bottom: 24px;
      width: 146px;
      height: 146px;
      touch-action: none;
    }
    .client-actions.layout-diamond { width: 168px; height: 168px; bottom: 18px; }
    .client-actions.layout-three { width: 158px; height: 158px; bottom: 20px; }
    .client-actions.layout-six {
      width: 186px;
      height: 122px;
      bottom: 26px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      align-items: center;
      justify-items: center;
    }
    .act-btn {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .14);
      border: 2px solid rgba(255, 255, 255, .35);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
    }
    .act-btn:active, .act-btn.active {
      background: rgba(239, 68, 68, .62);
      transform: scale(.93);
    }
    .layout-two .slot-left { left: 4px; bottom: 10px; border-color: #38bdf8; }
    .layout-two .slot-left.active { background: rgba(56, 189, 248, .62); }
    .layout-two .slot-right { right: 4px; top: 10px; border-color: #ef4444; }

    .layout-three .act-btn { width: 54px; height: 54px; }
    .layout-three .slot-bottom { left: 6px; bottom: 6px; border-color: #38bdf8; }
    .layout-three .slot-right { right: 6px; top: 52px; border-color: #ef4444; }
    .layout-three .slot-top { right: 16px; top: 2px; border-color: #22c55e; }

    .layout-diamond .act-btn { width: 52px; height: 52px; }
    .layout-diamond .slot-bottom { left: 58px; bottom: 2px; border-color: #38bdf8; }
    .layout-diamond .slot-right { right: 2px; top: 58px; border-color: #ef4444; }
    .layout-diamond .slot-top { left: 58px; top: 2px; border-color: #22c55e; }
    .layout-diamond .slot-left { left: 2px; top: 58px; border-color: #facc15; }
    .layout-diamond .slot-bottom.active { background: rgba(56, 189, 248, .62); }
    .layout-diamond .slot-top.active { background: rgba(34, 197, 94, .62); }
    .layout-diamond .slot-left.active { background: rgba(250, 204, 21, .62); color: #111; }

    .layout-six .act-btn {
      position: static;
      width: 52px;
      height: 52px;
    }
    .act-btn span { font-size: 14px; font-weight: 800; line-height: 1.05; }
    .layout-two .act-btn span { font-size: 18px; }
    .act-btn small { font-size: 9px; opacity: .82; margin-top: 2px; }

    .client-capsules {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }
    .cap-btn {
      min-width: 60px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .28);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      touch-action: none;
    }
    .cap-btn:active, .cap-btn.active { background: rgba(0, 210, 255, .55); }

    @media (max-width: 440px) {
      .client-dpad { left: 10px; bottom: 56px; width: 136px; height: 136px; }
      .dpad-btn { width: 42px; height: 42px; font-size: 16px; }
      .dpad-up { left: 47px; top: 3px; }
      .dpad-down { left: 47px; bottom: 3px; }
      .dpad-left { left: 3px; top: 47px; }
      .dpad-right { right: 3px; top: 47px; }
      .client-actions { right: 10px; bottom: 56px; }
      .client-actions.layout-diamond { width: 150px; height: 150px; bottom: 50px; }
      .layout-diamond .act-btn { width: 46px; height: 46px; }
      .layout-diamond .slot-bottom { left: 52px; }
      .layout-diamond .slot-top { left: 52px; }
      .layout-diamond .slot-right, .layout-diamond .slot-left { top: 52px; }
      .client-actions.layout-six { width: 164px; height: 108px; bottom: 58px; gap: 6px; }
      .layout-six .act-btn { width: 46px; height: 46px; }
      .client-capsules { bottom: 14px; }
    }

    .client-audio-prompt {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .client-audio-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(16, 185, 129, .5);
      margin-top: 16px;
    }
  </style>
  <script>
    // 全局异常可视上屏，杜绝静默黑屏
    window.addEventListener('error', function (e) {
      var box = document.getElementById('diag');
      if (box) box.textContent += ' [异常] ' + (e.message || e) + '\n';
    });
    window.addEventListener('unhandledrejection', function (e) {
      var box = document.getElementById('diag');
      if (box) box.textContent += ' [未处理拒绝] ' + e.reason + '\n';
    });
  </script>
</head>
<body data-mode="full">
  <header class="topbar">
    <div class="brand">
      Alex 游戏百宝箱 · 网页播放器
      <small id="game-label">载入中…</small>
    </div>
    <div class="controls">
      <select id="game-select" class="game-select" aria-label="选择游戏"></select>
      <div class="mode-switch" id="mode-switch">
        <button type="button" class="mode-btn" data-mode="full">全屏</button>
        <button type="button" class="mode-btn" data-mode="virtual">虚拟键</button>
        <button type="button" class="mode-btn" data-mode="deck">掌机</button>
      </div>
      <button type="button" class="mini-btn" id="btn-browser-fullscreen">浏览器全屏</button>
      <button type="button" class="mini-btn netplay-btn" id="btn-netplay">双人联机</button>
    </div>
  </header>

  <!-- 房主端联机弹窗 (扫码与房间管理) -->
  <div class="netplay-modal" id="netplay-modal">
    <div class="netplay-card">
      <h3>WebRTC 双人跨端联机</h3>
      <p>手机与电脑在同一 WiFi 或公网下，扫码即可作为 2P 加入双人联机对战！</p>
      <div class="room-badge" id="netplay-room-badge">PLAY-....</div>
      <div>
        <div class="qr-container" id="netplay-qrcode"></div>
      </div>
      <div class="netplay-ip-row" id="netplay-ip-row">
        <span>局域网/域名:</span>
        <input type="text" class="netplay-ip-input" id="netplay-host-input" placeholder="例如 192.168.0.100:8766" />
        <button type="button" class="netplay-action-btn secondary" id="btn-update-qr" style="padding: 4px 10px; font-size: 11px;">刷新码</button>
      </div>
      <div class="netplay-status-text" id="netplay-status-text">等待 2P 手机扫码连接...</div>
      <div class="netplay-actions">
        <button type="button" class="netplay-action-btn secondary" id="btn-copy-link">复制邀请链接</button>
        <button type="button" class="netplay-action-btn" id="btn-close-modal">关闭窗口</button>
      </div>
    </div>
  </div>

  <!-- 手机访客 (Client 2P) 专属独立视窗 -->
  <div id="client-stage">
    <video id="client-video" muted autoplay playsinline webkit-playsinline></video>
    <div class="client-header">
      <div class="client-pill">
        <span class="dot"></span><span id="client-game-title">2P 连接中</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button type="button" class="client-pill" id="btn-client-sound" style="display:none; cursor:pointer; background:rgba(16,185,129,.88); border-color:#34d399; color:#fff;">点此开声</button>
        <div class="client-pill" id="netplay-ping">--ms</div>
      </div>
    </div>
    <!-- 触控按键层（根据房主游戏 pad 动态生成） -->
    <div class="client-controls">
      <div class="client-shoulders" id="client-shoulders"></div>
      <!-- 左侧 D-Pad（支持 8 方向滑动切换） -->
      <div class="client-dpad touch-interactive" id="client-dpad">
        <div class="dpad-btn dpad-up">▲</div>
        <div class="dpad-btn dpad-down">▼</div>
        <div class="dpad-btn dpad-left">◀</div>
        <div class="dpad-btn dpad-right">▶</div>
      </div>
      <!-- 中间功能键（动态生成选择/投币与开始） -->
      <div class="client-capsules touch-interactive" id="client-capsules"></div>
      <!-- 右侧动作键（动态生成 2/3/4/6 键布局） -->
      <div class="client-actions touch-interactive" id="client-actions"></div>
    </div>
    <!-- 移动端音频破冰遮罩 -->
    <div class="client-audio-prompt" id="client-audio-prompt">
      <h3 id="client-prompt-title" style="color:#fff; font-size: 20px; margin-bottom: 8px;">正在连接 1P 房主...</h3>
      <p id="client-prompt-desc" style="color:#94a3b8; font-size: 14px;">正在建立点对点联机通道，请稍候</p>
      <button type="button" class="client-audio-btn" id="btn-client-start">开启声音并加入</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="frame-box" id="frame-box">
      <!-- 同源 iframe：父页可直接读取 contentWindow.GGEMU_CORE，不需要 postMessage -->
      <iframe id="game-frame" src="" allow="autoplay; fullscreen" title="游戏画面"></iframe>
    </div>

    <div class="full-stage" id="full-stage">
      <div id="screen-wrap">
        <canvas id="full-canvas"></canvas>
        <div class="full-actions" id="full-actions"></div>
        <div class="virtual-layer" id="virtual-layer"></div>
      </div>
      <div class="overlay-tools" id="overlay-tools">
        <button type="button" id="tool-save">存档</button>
        <button type="button" id="tool-load">读档</button>
        <button type="button" id="tool-reset">复位</button>
        <button type="button" id="tool-sound">声音</button>
        <button type="button" id="tool-fast">3× 加速</button>
        <button type="button" id="tool-record">59s 录屏</button>
      </div>
    </div>
  </main>

  <p class="notice" id="mode-notice">载入中… 点一下画面用键盘；顶栏可切「虚拟键」「掌机」。</p>

  <footer class="footer">
    <div class="status-line">
      <span id="gamepad-status">检测中…</span>
      <span id="kbd-hint" style="color: #38bdf8; font-size: 12px; margin-left: 12px;">键盘：WASD/方向键移动 · J 主键(B) · K 副键(A) · Enter 开始 · Shift 选择</span>
      <details id="debug-panel">
        <summary>调试</summary>
        <div>输入桥：<span id="bridge-status" class="">bridge-loading</span></div>
        <div id="diag">等待 iframe 载入…</div>
      </details>
    </div>
  </footer>

  <script src="shared/web/games.js"></script>
  <script src="shared/web/vendor/peerjs.min.js"></script>
  <script src="shared/web/vendor/qrcode.min.js"></script>
  <script src="shared/web/netplay.js"></script>
  <script src="shared/web/input-bridge.js"></script>
  <script src="shared/web/virtual-keys.js"></script>
  <script src="shared/web/keyboard.js"></script>
  <script src="shared/web/gamepad.js"></script>
  <script src="shared/web/player.js"></script>
</body>
</html>
